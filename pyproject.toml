[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixloop"
version = "0.1.0"
description = "Strictly gated autonomous software bug repair agent"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neatlogs>=1.4.26",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
anthropic = [
    "anthropic>=0.20.0",
]

[project.scripts]
fixloop = "src.fixloop.cli:main"

[tool.setuptools.package-data]
"src.fixloop" = ["prompt.txt"]
